name: Verify A and B
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:all
      - name: Portable process and Agent tool demo
        run: npm run verify:local
      - name: Independent process demo
        if: runner.os == 'Linux'
        run: npm run dev:init && npm run dev:start && npm run verify:b
      - if: always() && runner.os == 'Linux'
        run: npm run dev:stop
