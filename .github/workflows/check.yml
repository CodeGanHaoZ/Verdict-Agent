name: Verify backend and web
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run dataset:check
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run test:360
      - name: Portable process and Agent tool demo
        run: npm run verify:local
      - name: Independent process demo
        if: runner.os == 'Linux'
        run: npm run dev:init && npm run dev:start && npm run verify:b
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: npm run test:e2e
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always() && runner.os == 'Linux'
        run: npm run dev:stop
